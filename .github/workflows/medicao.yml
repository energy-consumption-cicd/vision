name: Medição de Energia — torchvision

# Opção C: workflow dedicado que invoca o run_pipeline.sh existente (mesmo
# padrão de sktime/yolov5/VW/PL/ncnn), rodando no self-hosted runner (tesla).
# Não substitui nem altera o test.yml original. ÚNICO ARQUIVO TOCADO NO FORK.
#
# Célula de referência espelhada: job `unittests-linux` do tests.yml upstream,
# célula (python-version=3.10, runner=linux.12xlarge, gpu-arch-type=cpu) —
# 1 de 6 células de teste. O trabalho medido está em .github/scripts/unittest.sh,
# não no YAML. SHA pinado: 0fba2e84fe255a2fcd81bd0b10c74d7fca99a89f (v0.29.0-rc1)

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "validacao = apenas run 0 (smoke test) | completa = warm-up + runs 1..10 + mediana"
        type: choice
        required: true
        default: validacao
        options:
          - validacao
          - completa

jobs:
  medicao:
    runs-on: [self-hosted, linux]
    env:
      # O contexto `env` do Actions nao expoe o HOME do processo do runner: a
      # interpolacao resolvia para string vazia e o upload-artifact nao achava
      # nada. NUNCA usar ${{ env.HOME }} (bug já corrigido em PL e VW).
      HOME_DIR: /home/maycon
    # build + test (sem train — torchvision é inference-only) + baseline 120s/run.
    # Estimativa: ~16 min/run → campanha completa ≈ 3,3 h (faixa 2,7-4,6 h).
    timeout-minutes: 1200

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: false   # projeto já está inteiro na imagem Docker

      - name: Permitir leitura dos contadores RAPL
        run: sudo /usr/local/bin/rapl-set-readable

      - name: Verificar disponibilidade do RAPL
        run: |
          if [ ! -d /sys/class/powercap/intel-rapl ]; then
            echo "❌ RAPL não disponível neste runner"
            exit 1
          fi
          echo "✅ Domínios RAPL disponíveis:"
          ls /sys/class/powercap/intel-rapl/

      - name: Verificar imagem Docker
        run: |
          if ! docker image inspect torchvision-medicao &>/dev/null; then
            echo "❌ Imagem 'torchvision-medicao' não encontrada no runner."
            echo "   Build manual na tesla antes de disparar este workflow:"
            echo "   docker build -t torchvision-medicao \\"
            echo "     -f ~/experimentos/medicao/repositorios/vision/Dockerfile \\"
            echo "     ~/experimentos/repositorios/inference-only/vision/"
            exit 1
          fi
          echo "✅ Imagem Docker encontrada."
          docker image inspect torchvision-medicao --format '{{.Created}}'

          # GATE 1 — PRÉ-COZIMENTO DO PESO. `docker image inspect` só prova que
          # ALGUMA imagem com esse nome existe. Testa-se o ARQUIVO DE PESO, com
          # o hash no nome e com tamanho mínimo: o modo de falha do sktime foi
          # exatamente um cache presente e VAZIO de pesos (1,7 MB de metadata),
          # que uma verificação de diretório aprovaria. Sem o peso, o
          # smoke_test.py morre sob --network none — e só se descobriria ao ler
          # os exit codes no fim da campanha.
          if ! docker run --rm --network none torchvision-medicao bash -c \
                 'W=/root/.cache/torch/hub/checkpoints/resnet50-11ad3fa6.pth; test -f "$W" && [ "$(stat -c%s "$W")" -gt 94000000 ]'; then
            echo "❌ A imagem 'torchvision-medicao' NÃO tem o peso do resnet50 pré-cozido."
            echo "   Esperado: /root/.cache/torch/hub/checkpoints/resnet50-11ad3fa6.pth, >94 MB."
            echo "   Reconstrua a imagem (ver Dockerfile, GATE 1)."
            exit 1
          fi
          echo "✅ Pré-cozimento presente (peso do resnet50 embutido)."

          # GATE 2 — TORCHVISION FUNCIONAL. Invertido em 2026-08-13 (teste local):
          # a versão anterior exigia AUSÊNCIA de .so em /project e quebrava o
          # stage `test` com "operator torchvision::nms does not exist". Cada
          # stage roda em `docker run --rm` próprio, então o `test` usa a
          # extensão da IMAGEM, não a que o `build` compilou. E a recompilação
          # medida é sempre do zero (build-temp efêmero do pip): medido, 34
          # unidades / 39,5 s com ou sem .so presentes.
          if ! docker run --rm --network none torchvision-medicao \
                 conda run -n ci python -c "import torch, torchvision; assert torch.ops.torchvision.nms is not None"; then
            echo "❌ Na imagem o torchvision não carrega a extensão C++."
            echo "   O stage 'test' falharia. Reconstrua (ver Dockerfile, GATE 2)."
            exit 1
          fi
          echo "✅ torchvision funcional (extensão C++ carregada, ops registrados)."

          # GATE 3 — RECURSOS DE REDE PRÉ-COZIDOS (2026-08-14). Sem eles, 19
          # testes falham sob --network none e a lista {0} não se sustenta.
          #   (a) os 7 GIFs do giflib, conferidos por sha256
          #   (b) o backbone IMAGENET1K_V1 do lraspp — HASH EXATO no nome, não
          #       glob: um glob aprovou o peso ERRADO (a V2) em 2026-08-14 e o
          #       teste seguiu falhando. Mesmo defeito do gate do sktime.
          #   (c) o stub responde nos dois truststores (certifi p/ requests,
          #       OpenSSL do conda p/ urllib)
          GATE3_PY='import requests,urllib.request; r=requests.get("https://sourceforge.net/p/giflib/code/ci/master/tree/pic/fire.gif?format=raw",timeout=10); assert r.status_code==200 and r.content[:6] in (b"GIF87a",b"GIF89a"); u=urllib.request.urlopen("https://drive.google.com/file/d/XYZ/view",timeout=10); assert u.status==200 and u.url.endswith("/view")'
          if ! docker run --rm --network none \
                 --add-host sourceforge.net:127.0.0.1 \
                 --add-host drive.google.com:127.0.0.1 \
                 -e "GATE3_PY=$GATE3_PY" torchvision-medicao \
                 bash -c 'cd /opt/prebake && sha256sum -c SHA256SUMS >/dev/null && test -s /root/.cache/torch/hub/checkpoints/mobilenet_v3_large-8738ca79.pth && conda run -n ci python -c "$GATE3_PY"'; then
            echo "❌ Recursos de rede pré-cozidos ausentes ou stub não responde."
            echo "   19 testes falhariam por rede. Reconstrua com --build-context prebake=..."
            exit 1
          fi
          echo "✅ Recursos de rede pré-cozidos e stub respondendo."

      # --- MODO validacao: apenas run 0, resultado não conta para a mediana ---
      - name: Run de validação (run 0)
        if: ${{ inputs.campaign == 'validacao' }}
        run: |
          RESULTS_DIR="$HOME/experimentos/medicao/resultados/torchvision/runs"

          # Cópia LITERAL da validar_csv do step "Executar 10 runs de medição".
          # Duplicada de propósito: cada `run:` do Actions é um shell próprio e
          # funções não atravessam steps. Se uma mudar, a outra tem de mudar junto.
          validar_csv() {
            local csv="$1"
            [ -f "$csv" ] || return 1
            awk -F, '
              NR==1 { next }
              $2=="build"||$2=="test"||$2=="total" {
                seen[$2]=1
                if ($3==""||$4==""||$7=="" || $3+0<=0 || $4+0<=0 || $7+0<=0) inval[$2]=1
              }
              END {
                split("build test total", req, " ")
                for (i in req) {
                  s=req[i]
                  if (!(s in seen)) exit 1
                  if (s in inval)   exit 1
                }
                exit 0
              }
            ' "$csv"
          }

          # ─── D-8 (2026-08-08): FALHA DO WORKLOAD ≠ FALHA DA MEDIÇÃO ─────────
          #
          # O step roda sob `bash -e`. Antes desta correção, o exit 1 do
          # run_pipeline.sh matava o step AQUI, e tudo o que vem abaixo — o `mv`
          # para runs/validacao/ e os dois sanity checks — era silenciosamente
          # pulado. Foi o que aconteceu no job 92987000108: o CSV ficou em
          # runs/run_00.csv, runs/validacao/ nunca foi criado, e nenhum
          # ::warning:: de (user+sys)/wall foi emitido apesar do ratio anômalo.
          #
          # ATUALIZADO 2026-08-11 — a D-2 está SUPERADA. Até 2026-08-10 o exit
          # != 0 era permanente por design (os 4 erros de test_url_reader.py sob
          # --network none). Com o pré-cozimento dos datasets de biolab.si, o
          # stage `test` passa a sair 0.
          #
          # A tolerância continua NECESSÁRIA, por outro motivo: o SIGABRT latente
          # do PyQt5 (exit 134, ~14% das runs) produziria um `bash -e` matando o
          # step no meio, e com ele o `mv`, os sanity checks e — em
          # campaign=completa — as runs seguintes. Capturar o código em vez de
          # morrer é o que permite REGISTRAR a run inválida e seguir; a decisão
          # sobre rejeitá-la é da regra de exit code, não do `bash -e`.
          #
          # `|| PIPELINE_EXIT=$?` captura o código SEM engolir: ele é testado
          # abaixo e vira ::warning::. Não é `|| true` — o valor é preservado.
          # O sidecar exit_codes_run_00.txt continua registrando o código real de
          # cada stage, que é o registro de veracidade do estudo.
          PIPELINE_EXIT=0
          bash "$HOME/experimentos/medicao/repositorios/vision/run_pipeline.sh" 0 \
            || PIPELINE_EXIT=$?

          # run 0 é smoke test: mover run_00.csv para fora de runs/ para não
          # entrar na agregação da mediana (aggregate.py globa runs/run_*.csv)
          #
          # CORREÇÃO DO DEFEITO DE BOOKKEEPING (docs/defeito_sidecar_validacao.md,
          # proposta A). O CSV e o exit_codes_run_00.txt são um PAR. Nos seis
          # projetos do estudo o `mv` levava só o CSV, e a run 00 seguinte
          # sobrescrevia o sidecar — perdendo a evidência de exit code, que é o
          # artefato de que a regra §E depende. O torchvision NASCE corrigido;
          # a retroportagem para os outros cinco é decisão separada.
          mkdir -p "$RESULTS_DIR/validacao"
          if [ -f "$RESULTS_DIR/run_00.csv" ]; then
            mv -f "$RESULTS_DIR/run_00.csv" "$RESULTS_DIR/validacao/run_00.csv"
            echo "ℹ️  run_00.csv movido para runs/validacao/ (não conta para os resultados)"
          fi
          if [ -f "$RESULTS_DIR/exit_codes_run_00.txt" ]; then
            mv -f "$RESULTS_DIR/exit_codes_run_00.txt" \
                  "$RESULTS_DIR/validacao/exit_codes_run_00.txt"
            echo "ℹ️  exit_codes_run_00.txt movido junto (par CSV+sidecar preservado)"
          fi

          # ─── GATE DE MEDIÇÃO ────────────────────────────────────────────────
          # É AQUI que o job pode falhar, e só aqui: CSV ausente, linha
          # malformada, ou energy_pkg_j/energy_cores_j/wall_time_s zerados ou
          # vazios — isto é, container que não subiu, RAPL ilegível, escrita do
          # CSV interrompida. Falha de MEDIÇÃO. O exit code do workload não entra
          # nesta decisão. Vem antes dos awk porque eles leem o mesmo arquivo:
          # sem o gate, um CSV ausente viraria um erro obscuro do awk.
          if ! validar_csv "$RESULTS_DIR/validacao/run_00.csv"; then
            echo "::error title=Falha de medição::run 0: CSV ausente ou inválido em runs/validacao/run_00.csv (pipeline exit=$PIPELINE_EXIT). Energia e/ou wall não foram medidos — isto NÃO é a falha esperada do workload."
            exit 1
          fi
          if [ "$PIPELINE_EXIT" -ne 0 ]; then
            echo "::warning title=Exit code fora do esperado::run 0: run_pipeline.sh saiu com exit=$PIPELINE_EXIT, mas a lista DECLARADA para o torchvision é {0} em ambos os stages. O que sustenta a proposta: o commands.sh chama pytest DIRETAMENTE (sem wrapper make, ao contrário do sktime), então o exit code é o do pytest; e a run de referencia do CI upstream fecha verde (23877 passed, 17750 skipped, 245 deselected, 350 xfailed, 0 failed). Lista declarada em 2026-08-14, apos o teste local fechar VERDE: 23716 passed, 0 failed, exit 0 nos 3 blocos e no stage. Semantica do pytest: 1 = testes falharam; 2 = interrompido; 3 = erro interno; 5 = nenhum teste coletado. Codigos por stage em runs/validacao/exit_codes_run_00.txt."
          fi
          echo "✅ run 0: medição válida (exit do workload=$PIPELINE_EXIT)"

          # Sanity check não bloqueante de user/sys (ver alertar_user_sys no modo completa).
          # TORCHVISION: espera-se ratio > 0.5 nos DOIS stages — alerta é sinal
          # REAL. O `build` compila C++ (CPU-bound) e o `test` roda pytest
          # single-thread; nenhum dos dois é I/O-bound. Mesma leitura do orange3,
          # NÃO a do sktime (cujo build era `uv pip install --offline`).
          awk -F, '
            NR==1 { next }
            ($2=="build" || $2=="test") && $7+0 > 0 {
              r = ($8 + $9) / $7
              if (r < 0.5)
                printf "::warning::[run 0] stage %s: (user+sys)/wall = %.4f < 0.5 (user=%ss sys=%ss wall=%ss) — captura de user/sys pode ter regredido para o host\n", $2, r, $8, $9, $7
            }
          ' "$RESULTS_DIR/validacao/run_00.csv"
          # Sanity check não bloqueante de paginação (ver alertar_swap no modo completa).
          awk -F, -v LIMIAR="${SWAP_WARN_PAGES:-256}" '
            NR==1 { next }
            NF >= 13 && ($2=="build" || $2=="test") && $13+0 > LIMIAR {
              printf "::warning::[run 0] stage %s: swap_out_pages=%s (swap_in_pages=%s, limiar %s) — houve paginação do host durante a janela medida; run suspeita por contenção de I/O\n", $2, $13, $12, LIMIAR
            }
          ' "$RESULTS_DIR/validacao/run_00.csv"

      # --- MODO completa: 10 runs oficiais + mediana (com skip-if-exists) ---
      - name: Executar 10 runs de medição
        if: ${{ inputs.campaign == 'completa' }}
        run: |
          RESULTS_DIR="$HOME/experimentos/medicao/resultados/torchvision/runs"
          PIPELINE="$HOME/experimentos/medicao/repositorios/vision/run_pipeline.sh"
          # Garantir que nenhum run_00.csv de validação polua a mediana
          rm -f "$RESULTS_DIR/run_00.csv"

          # ─── PROVENIÊNCIA TEMPORAL (2026-08-11) ─────────────────────────────
          # Registra a ORDEM REAL de execução, que o conjunto final não preserva
          # sozinho: pela regra E.4, uma run rejeitada é reposta reexecutando o
          # MESMO número, então `run_03` pode ter sido a última a rodar.
          #
          # Isso não afeta a mediana, mas afeta três análises previstas:
          # convergência da mediana run-a-run (o argumento que sustenta n=10
          # contra a convenção de 30), estacionariedade do baseline ao longo da
          # campanha, e detecção de padrões de anomalia de wall_time (no yolov5 o
          # padrão foi "a cada 3 runs", visível só com a ordem real).
          #
          # POR QUE AQUI, e não no run_pipeline.sh: o script de medição fica
          # congelado às vésperas de campanha. Esta é a camada de ORQUESTRAÇÃO —
          # ela já sabe a ordem, basta escrevê-la. As colunas do CSV oficial
          # também não são tocadas: são 13, comuns aos 6 projetos e consumidas
          # pelo aggregate.py; acrescentar uma só no torchvision quebraria a
          # agregação. Daí o sidecar.
          #
          # NOME: `ordem_execucao.txt` NÃO casa com o glob `run_*.csv` do
          # aggregate.py — mesma precaução do `exit_codes_run_NN.txt`.
          #
          # APPEND-ONLY, nunca truncado: se a campanha for reexecutada, as
          # linhas se acumulam, e isso é o comportamento certo — o arquivo
          # registra o que ACONTECEU, não o que sobrou.
          ORDEM="$RESULTS_DIR/ordem_execucao.txt"
          if [ ! -f "$ORDEM" ]; then
            echo "# ordem real de execução (append-only) — run,inicio_utc,fim_utc,exit,origem" > "$ORDEM"
          fi
          agora_utc() { date -u +%Y-%m-%dT%H:%M:%SZ; }

          # Valida run_NN.csv: 3 stages (build/test/total) presentes e colunas
          # críticas (energy_pkg_j, energy_cores_j, wall_time_s) não-vazias e > 0.
          # user_time_s/sys_time_s NÃO entram na validação (não usados na análise).
          #
          # NOTA: `validar_csv` NÃO olha exit code, e isso permanece deliberado —
          # mas o motivo mudou em 2026-08-11. Antes era porque o `test` saía
          # não-zero em TODA run (D-2, hoje SUPERADA pelo pré-cozimento). Agora é
          # separação de responsabilidades: esta função responde "a MEDIÇÃO
          # aconteceu?" (energia e wall foram gravados), que é o que decide se o
          # job falha. "O WORKLOAD foi o certo?" é a pergunta do exit code, e a
          # resposta dela rejeita a RUN, não o job.
          #
          # A regra de rejeição por exit code está congelada em
          # infraestrutura/revisao_metodologica.md (seção "Códigos de saída
          # aceitáveis"), datada ANTES desta campanha. Ela ainda NÃO está
          # implementada aqui: a conferência do sidecar exit_codes_run_NN.txt
          # contra {0} é manual, no pós-campanha. Os códigos ficam registrados
          # por stage no sidecar para essa auditoria.
          validar_csv() {
            local csv="$1"
            [ -f "$csv" ] || return 1
            awk -F, '
              NR==1 { next }
              $2=="build"||$2=="test"||$2=="total" {
                seen[$2]=1
                if ($3==""||$4==""||$7=="" || $3+0<=0 || $4+0<=0 || $7+0<=0) inval[$2]=1
              }
              END {
                split("build test total", req, " ")
                for (i in req) {
                  s=req[i]
                  if (!(s in seen)) exit 1
                  if (s in inval)   exit 1
                }
                exit 0
              }
            ' "$csv"
          }

          # Sanity check NÃO bloqueante de user/sys (mesmo mecanismo de PL/yolov5/VW/sktime).
          #
          # ⚠️  ATENÇÃO — A SEMÂNTICA AQUI É DIFERENTE DA DO SKTIME. Não copie a
          # leitura de lá. No sktime o `build` é `uv pip install --offline`, puro
          # I/O, e ratio < 0.5 no build era falso positivo ESPERADO e ignorável.
          #
          # No torchvision o `build` NÃO é I/O-bound: ele compila 7 unidades de
          # tradução C++ (torchvision/_C, _C_stable, image_stable) com gcc via
          # ninja, a partir do fonte, offline (wheels em /wheelhouse). É trabalho
          # de CPU genuíno — a leitura correta é a do ORANGE3, não a do sktime.
          # O GATE 2 do Dockerfile garante que /project está pristino na imagem,
          # então toda run compila do zero — nunca incremental.
          #
          # Consequência prática: ratio < 0.5 no `build` do torchvision é sinal
          # REAL (compilação não aconteceu, ou a captura fd3 regrediu), e o mais
          # provável é o GATE 2 ter falhado. Investigar, não ignorar.
          #
          # PORTANTO: espera-se ratio > 0.5 nos DOIS stages. Um alerta no build
          # é SINAL REAL (ou a compilação não aconteceu — build incremental,
          # wheel pré-built vazando para o wheelhouse — ou a captura fd3
          # regrediu para o host), não ruído a ignorar. Investigar sempre.
          #
          # O `test` é serial (coverage run -m unittest, sem xdist), logo
          # espera-se ratio próximo de 1, não > 1 como no sktime com -n 4.
          alertar_user_sys() {
            local csv="$1" origem="$2"
            [ -f "$csv" ] || return 0
            awk -F, -v origem="$origem" '
              NR==1 { next }
              ($2=="build" || $2=="test") && $7+0 > 0 {
                r = ($8 + $9) / $7
                if (r < 0.5)
                  printf "::warning::[%s] stage %s: (user+sys)/wall = %.4f < 0.5 (user=%ss sys=%ss wall=%ss) — captura de user/sys pode ter regredido para o host, OU a compilação do build não aconteceu\n", origem, $2, r, $8, $9, $7
              }
            ' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          }

          # Sanity check NÃO bloqueante de paginação (colunas 12/13 do CSV:
          # swap_in_pages, swap_out_pages). O host mantém /swapfile de 16G como
          # salvaguarda de disponibilidade, mas o container medido roda com
          # memory.swap.max=0 e é incapaz de paginar. Um swap_out_pages > 0
          # significa que ALGUM processo do HOST paginou durante a janela medida
          # — pressão de memória que gera contenção de I/O no BX500 (sem DRAM) e
          # infla wall_time sem energia proporcional. Run suspeita: analisar
          # antes de incluir no conjunto válido. Ver docs/robustez_tesla.md §4.
          #
          # LIMIAR: o valor é SEMPRE gravado no CSV; o ::warning:: só dispara
          # acima de 256 páginas (1 MiB). Swap-out de ~15 páginas (60 KB) foi
          # medido em operação normal — é ruído. Alerta que dispara a 15 páginas
          # apareceria em quase toda run e seria aprendido como ignorável.
          #
          # No torchvision espera-se ZERO paginação: o `test` é um único
          # processo Python serial (pytest SEM `-n`), e o `build` são no máximo
          # ~7 g++ simultâneos, contra um teto de 12g. Sem o aninhamento 4×8 que
          # estourou o sktime.
          alertar_swap() {
            local csv="$1" origem="$2"
            [ -f "$csv" ] || return 0
            # CSVs anteriores à instrumentação não têm as colunas: NF<13 -> pula.
            awk -F, -v origem="$origem" -v LIMIAR="${SWAP_WARN_PAGES:-256}" '
              NR==1 { next }
              NF >= 13 && ($2=="build" || $2=="test") && $13+0 > LIMIAR {
                printf "::warning::[%s] stage %s: swap_out_pages=%s (swap_in_pages=%s, limiar %s) — houve paginação do host durante a janela medida; run suspeita por contenção de I/O\n", origem, $2, $13, $12, LIMIAR
              }
            ' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"
            return 0
          }

          # --- Warm-up descartado (convenção: 11 runs, mediana sobre os 10 válidos) ---
          PENDENTES=0
          for i in $(seq 1 10); do
            validar_csv "$RESULTS_DIR/run_$(printf '%02d' "$i").csv" || PENDENTES=$((PENDENTES+1))
          done
          if [ "$PENDENTES" -gt 0 ]; then
            echo "::group::Warm-up (descartado da análise)"
            echo "🔥 $PENDENTES run(s) pendente(s) — executando warm-up antes dos runs oficiais"
            mkdir -p "$RESULTS_DIR/warmup"
            # D-8: exit != 0 do workload não aborta o warm-up. Desde o
            # pré-cozimento o esperado é 0; a tolerância existe para o SIGABRT
            # latente (134) não matar o step antes do `mv`.
            WARMUP_EXIT=0
            T_INI=$(agora_utc)
            bash "$PIPELINE" 0 || WARMUP_EXIT=$?
            echo "00,$T_INI,$(agora_utc),$WARMUP_EXIT,warmup" >> "$ORDEM"
            if [ ! -f "$RESULTS_DIR/run_00.csv" ]; then
              echo "::error title=Falha de medição::warm-up: run_pipeline.sh (exit=$WARMUP_EXIT) não escreveu run_00.csv — falha de medição, não do workload."
              exit 1
            fi
            mv -f "$RESULTS_DIR/run_00.csv" "$RESULTS_DIR/warmup/run_warmup.csv"
            # Mesma correção do modo validacao: o sidecar acompanha o CSV.
            if [ -f "$RESULTS_DIR/exit_codes_run_00.txt" ]; then
              mv -f "$RESULTS_DIR/exit_codes_run_00.txt" \
                    "$RESULTS_DIR/warmup/exit_codes_run_warmup.txt"
            fi
            if [ "$WARMUP_EXIT" -ne 0 ]; then
              echo "::warning title=Exit code fora do esperado::warm-up: run_pipeline.sh saiu com exit=$WARMUP_EXIT; o esperado é 0. O warm-up é descartado da análise de qualquer forma, então isto não invalida a campanha — mas exit=134 aqui é indício de que o SIGABRT do PyQt5 está ativo nesta sessão, e vale acompanhar as runs oficiais de perto."
            fi
            alertar_user_sys "$RESULTS_DIR/warmup/run_warmup.csv" "warm-up"
            alertar_swap "$RESULTS_DIR/warmup/run_warmup.csv" "warm-up"
            {
              echo "## Warm-up executado e DESCARTADO (não entra na mediana)"
              echo "- $PENDENTES run(s) pendente(s) nesta sessão; CSV em \`runs/warmup/run_warmup.csv\` (sobrescrito a cada sessão)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            echo "⏳ Repouso pós-warm-up (120s)..."
            sleep 120
          else
            echo "✅ Campanha já completa (10 runs válidas) — warm-up desnecessário"
            echo "## Warm-up pulado — campanha já estava completa" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "## Execução (modo completa) — skip-if-exists" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 10); do
            NN=$(printf '%02d' "$i")
            CSV="$RESULTS_DIR/run_${NN}.csv"
            echo "::group::Run $i de 10"
            if validar_csv "$CSV"; then
              echo "✅ Run $NN já existe e é válida — pulando"
              echo "- Run $NN: já existe e é válida — **pulada**" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi
            if [ -f "$CSV" ]; then
              echo "♻️  Run $NN incompleta/inválida — reexecutando (sobrescreve)"
              echo "- Run $NN: CSV inválido/incompleto — **reexecutada**" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$CSV"
            else
              echo "▶️  Run $NN ausente — executando"
              echo "- Run $NN: ausente — **executada**" >> "$GITHUB_STEP_SUMMARY"
            fi
            # ─── D-8: o loop TOLERA exit != 0 do workload ────────────────────
            # Desde o pré-cozimento (2026-08-10) o esperado é exit 0, mas a
            # tolerância CONTINUA necessária: sem ela, uma run que caia no
            # SIGABRT latente do PyQt5 (134, ~14%) mataria o `bash -e` e levaria
            # junto as runs seguintes — trocaria 1 run a repor por uma campanha
            # inteira a refazer. O código é capturado, não engolido: vira
            # ::warning:: abaixo e fica registrado por stage no sidecar
            # exit_codes_run_NN.txt, que é o que a auditoria pós-campanha lê.
            RUN_EXIT=0
            T_INI=$(agora_utc)
            bash "$PIPELINE" "$i" || RUN_EXIT=$?
            echo "$NN,$T_INI,$(agora_utc),$RUN_EXIT,campanha" >> "$ORDEM"
            alertar_user_sys "$CSV" "run $NN"
            alertar_swap "$CSV" "run $NN"
            # Gate de MEDIÇÃO: aqui, e só aqui, o job falha. CSV ausente ou com
            # energia/wall zerados significa container que não subiu, RAPL
            # ilegível ou escrita interrompida — a campanha não tem como
            # prosseguir e para na hora, em vez de gastar horas nas runs
            # seguintes com a mesma infraestrutura quebrada.
            if ! validar_csv "$CSV"; then
              echo "::error title=Falha de medição::run $NN: CSV ausente ou inválido após o pipeline (exit=$RUN_EXIT). Energia e/ou wall não foram medidos — campanha abortada."
              echo "- Run $NN: **FALHA DE MEDIÇÃO** (pipeline exit=$RUN_EXIT) — campanha abortada" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$RUN_EXIT" -ne 0 ]; then
              echo "::warning title=Exit code fora do esperado::run $NN: run_pipeline.sh saiu com exit=$RUN_EXIT, mas o esperado no torchvision e 0 em ambos os stages. Pela regra congelada em revisao_metodologica.md secao E, esta run deve ser REJEITADA e REPOSTA. O CSV foi preservado e o aggregate.py ainda o contabiliza — a exclusao e MANUAL no pos-campanha. Codigos por stage em runs/exit_codes_run_$NN.txt; log completo do stage em resultados/torchvision/logs/."
              echo "- Run $NN: workload exit=$RUN_EXIT — **fora do esperado (0)**. Run a REJEITAR e REPOR; CSV preservado, exclusão manual (o aggregate.py ainda o conta)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
            if [ "$i" -lt 10 ]; then
              echo "⏳ Repouso entre runs (120s)..."
              sleep 120
            fi
          done

          # Varredura final: cobre também runs pré-existentes puladas pelo skip-if-exists.
          for i in $(seq 1 10); do
            NN=$(printf '%02d' "$i")
            alertar_user_sys "$RESULTS_DIR/run_${NN}.csv" "run $NN"
            alertar_swap "$RESULTS_DIR/run_${NN}.csv" "run $NN"
          done

          # ─── Pré-condição EXPLÍCITA do step de medianas ─────────────────────
          # O step "Calcular medianas" só roda se ESTE step terminar com sucesso
          # (comportamento padrão do Actions — sem `if: always()` lá). Antes do
          # D-8 essa garantia vinha de graça do `bash -e`; agora que o exit do
          # workload é tolerado, ela precisa ser afirmada, e não inferida.
          # Sem isto, um CSV inválido numa run pulada pelo skip-if-exists
          # chegaria ao aggregate.py e produziria mediana sobre menos de 10 runs.
          INVALIDAS=""
          for i in $(seq 1 10); do
            NN=$(printf '%02d' "$i")
            validar_csv "$RESULTS_DIR/run_${NN}.csv" || INVALIDAS="${INVALIDAS:+$INVALIDAS }$NN"
          done
          if [ -n "$INVALIDAS" ]; then
            echo "::error title=Campanha incompleta::runs com CSV ausente ou inválido: $INVALIDAS — as medianas NÃO serão calculadas."
            echo "- **Campanha incompleta** — runs inválidas: $INVALIDAS" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ 10 runs com CSV válido — pré-condição do aggregate.py satisfeita"

      - name: Calcular medianas (após run 10)
        if: ${{ inputs.campaign == 'completa' }}
        run: |
          RESULTS_DIR="$HOME/experimentos/medicao/resultados/torchvision/runs"
          SUMMARY="$HOME/experimentos/medicao/resultados/torchvision/summary.csv"
          python3 "$HOME/experimentos/medicao/scripts/aggregate.py" "$RESULTS_DIR" "$SUMMARY"
          {
            echo ""
            echo "## Medianas (10 runs) — torchvision"
            echo '```'
            cat "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Docker --privileged grava arquivos como root no workspace; corrige o dono
      # via container descartável (evita depender de sudo com senha no runner).
      - name: Corrigir permissões do workspace
        if: always()
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}":/w \
            alpine chown -R "$(id -u):$(id -g)" /w || true

      - name: Upload dos resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-torchvision-${{ github.run_number }}
          # NOTA_FIDELIDADE.md é documento de consulta interna, local na tesla:
          # fica fora do artefato.
          path: |
            ${{ env.HOME_DIR }}/experimentos/medicao/resultados/torchvision/
            !${{ env.HOME_DIR }}/experimentos/medicao/resultados/torchvision/NOTA_FIDELIDADE.md
          retention-days: 90
